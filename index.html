  <style>
    #ms-shell {
      position: fixed;
      inset: 0;
      background: #0a0b0f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ms-shell::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.015;
      background-image:
        linear-gradient(rgba(0, 229, 255, 1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 1) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    #ms-shell span {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #8892a4;
      animation: ms-breathe 2s ease-in-out infinite;
    }

    @keyframes ms-breathe {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.7;
      }
    }
  </style>
</head>

<body style="background:#0a0b0f;margin:0">
  <div id="root">
    <div id="ms-shell"><span>Authenticating</span></div>
  </div>
